name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: python -m pip install "uv==0.12.0"

      - name: Sync locked environment
        run: python -m uv sync --frozen --extra dev --python "$(which python)" --no-managed-python

      - name: Check fatal Python errors
        run: .venv/bin/python -m ruff check app tests scripts evaluation --select E9,F63,F7,F82

      - name: Run tests with coverage floor
        run: .venv/bin/python -m pytest --cov-fail-under=25
