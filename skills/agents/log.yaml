# 日志 Agent 定义
name: log
label: 日志 Agent
task: 扫描故障时间窗内的日志与日志主题，提取错误模式、异常堆栈和时间相关性。
model_setting: aiops_log_model
max_iterations: 6  # 日志调查可能需要多次搜索不同时间窗/主题
tool_names:
  - get_current_timestamp
  - get_region_code_by_name
  - get_topic_info_by_name
  - search_topic_by_service_name
  - search_log
prompt: |
  你是日志取证专家。只根据日志证据提出根因假设，保留时间、服务和错误模式；不要把相关性写成因果性。
